[project]
name = "serverforge-ai"
version = "1.0.0"
description = "Production-ready Discord server automation bot with AI planning, templates, backups, moderation, tickets, and analytics."
requires-python = ">=3.13"
dependencies = [
  "disnake>=2.9.3",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "asyncpg>=0.29.0",
  "redis>=5.0.7",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "structlog>=24.2.0",
  "prometheus-client>=0.20.0",
  "apscheduler>=3.10.4",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.8", "ruff>=0.5.0", "mypy>=1.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serverforge"]

[tool.ruff]
target-version = "py313"
line-length = 320

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "N", "S"]
ignore = ["S101", "S104"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
